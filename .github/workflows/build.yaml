name: Build envoy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: SHA of the commit
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0

      - name: Clone envoy
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          repository: envoyproxy/envoy
          path: src/envoy
          ref: ${{ github.event.inputs.version }}

      - name: Get envoy SHA
        id: envoy-commit
        shell: bash
        run: |
          cd ./src/envoy
          echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"

      - uses: satackey/action-docker-layer-caching@46d2c640b1d8ef50d185452ad6fb324e6bd1d052 # v0.0.11
        continue-on-error: true

      - run: |
          cd src/envoy && \
          ./ci/run_envoy_docker.sh './ci/do_ci.sh bazel.release' && \
          ./ci/run_envoy_docker.sh './ci/do_ci.sh bazel.release.server_only' && \
          docker build -f ci/Dockerfile-envoy -t ghcr.io/jcchavezs/envoy:${{ steps.envoy-commit.outputs.sha_short }} .

      - run: docker push ghcr.io/jcchavezs/envoy:${{ steps.envoy-commit.outputs.sha_short }}
